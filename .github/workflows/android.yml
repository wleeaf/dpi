name: Android build and test

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
      release:
        type: boolean
        default: false
    secrets:
      DPI_ANDROID_KEYSTORE_BASE64:
        required: false
      DPI_ANDROID_STORE_PASSWORD:
        required: false
      DPI_ANDROID_KEY_ALIAS:
        required: false
      DPI_ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
      - name: Install SDK and pinned tunnel library
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python3 scripts/fetch-android-tunnel.py
      - name: Test relay, build app, and run lint
        run: |
          bash tests/android-core.sh
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :probe:assembleDebug :probe:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify TCP, UDP, native VPN routing, and disconnect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          script: python3 tests/android-emulator.py
      - name: Package signed release
        if: inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.DPI_ANDROID_KEYSTORE_BASE64 }}
          DPI_ANDROID_STORE_PASSWORD: ${{ secrets.DPI_ANDROID_STORE_PASSWORD }}
          DPI_ANDROID_KEY_ALIAS: ${{ secrets.DPI_ANDROID_KEY_ALIAS }}
          DPI_ANDROID_KEY_PASSWORD: ${{ secrets.DPI_ANDROID_KEY_PASSWORD }}
          DPI_ANDROID_KEYSTORE: ${{ runner.temp }}/dpi-release.jks
          RELEASE_VERSION: ${{ inputs.version }}
          DPI_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          if not os.environ.get('KEYSTORE_BASE64') or not os.environ.get('DPI_ANDROID_STORE_PASSWORD'):
              raise SystemExit('Configure Android signing secrets before publishing. See docs/DEVELOPMENT.md.')
          path = Path(os.environ['DPI_ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          python3 scripts/build-android.py "$RELEASE_VERSION"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/dpi-*-android.apk
      - name: Package development APK
        if: '!inputs.release'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/dpi-$RELEASE_VERSION-android-preview.apk"
          cd dist
          sha256sum dpi-*-android-preview.apk > "dpi-$RELEASE_VERSION-android-preview.apk.sha256"
      - name: Remove temporary signing key
        if: always()
        run: python3 -c 'from pathlib import Path; import os; (Path(os.environ["RUNNER_TEMP"]) / "dpi-release.jks").unlink(missing_ok=True)'
      - uses: actions/upload-artifact@v7
        with:
          name: dpi-android
          path: |
            dist/dpi-*.apk
            dist/dpi-*.apk.sha256
          if-no-files-found: error
