name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
  android:
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
      release: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libcap-dev libnetfilter-queue-dev libmnl-dev shellcheck nftables
      - name: Validate and build
        env:
          BUILD_VERSION: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          shellcheck dpi scripts/*.sh tests/*.sh macos/*.sh macos/Install.command macos/pkg-scripts/* enable.sh disable.sh nft-start.sh nft-stop.sh
          CFLAGS="-DZAPRET_GH_VER=$BUILD_VERSION -DZAPRET_GH_HASH=$BUILD_COMMIT" make -C nfq
          python3 -m unittest discover -s tests -v
          sudo unshare --net bash tests/firewall.sh
      - name: Package ready-to-install archive
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: bash scripts/package.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: dpi-linux-${{ matrix.arch }}
          path: |
            dist/dpi-*.tar.gz
            dist/dpi-*.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows, android, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dpi-*
          merge-multiple: true
      - name: Combine archive checksums
        run: |
          cd dist
          cat dpi-*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Download the file for your device:

          - **Windows 10/11 x64:** extract the ZIP, run `Install.cmd`, accept the administrator prompt. Open **DPI** from the Start menu to change settings.
          - **Android 10+:** install the APK, open **DPI**, tap **Connect**, and accept Android's VPN prompt. No root or remote server needed.
          - **macOS 15+ (Intel and Apple Silicon):** open the universal PKG installer, then open **DPI** in Applications. Mac downloads are not Developer ID signed/notarized yet; if blocked, approve this download through Privacy & Security → Open Anyway. A terminal archive is also included (`sudo ./dpi install`).
          - **Linux:** extract the x86_64 or arm64 archive, open a terminal in it, and run:

          ```sh
          sudo ./dpi install
          ```

          Restart Discord after connecting. Desktop updates preserve existing settings.
          Linux requires systemd, nftables, and glibc 2.35+; runtime libraries install automatically with apt/dnf/pacman.
          Android applies TCP splitting/TLS record fragmentation; UDP is forwarded unchanged, so voice bypass is more limited than Windows/Linux.
          macOS also uses TCP/TLS splitting and leaves UDP unchanged. It preserves existing PF rules and settings.
          See the English README for configuration and troubleshooting. Strategies depend on your ISP.
          `SHA256SUMS` covers all downloads.
          EOF
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/dpi-*.tar.gz dist/dpi-*.zip dist/dpi-*.apk dist/dpi-*.pkg dist/SHA256SUMS \
            --verify-tag --title "DPI $RELEASE_TAG" --notes-file release-notes.md "${options[@]}"
